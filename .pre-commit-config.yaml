# The hooks that run before every commit. setup_project.py installs them (pre-commit install, once per clone).
# rev pins the version of each tool, so that you, everybody else, and the check on GitHub format alike.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files  # data and results belong elsewhere, not in a 5 MB file in git
        args: [--maxkb=5000]
  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 26.10.1
    hooks:
      - id: black
